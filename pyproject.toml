[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mehwar"
version = "0.1.0"
description = "Navigation-controller capability-boundary evaluation contracts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ppo = [
    "numpy>=2,<3",
    "torch>=2.10,<3",
]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["real_checkpoint: requires MEHWAR_SEED33_CHECKPOINT and the ppo extra"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.packages.find]
where = ["src"]
